<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1A2D5A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shop Manager">
  <title>Shop Manager</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ───────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F0F4F8;   /* Always light gray — never dark navy bleed */
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    body { margin: 0; font-family: Inter, sans-serif; }

    /* ── Root fills full screen ─────────────────────────────── */
    #root {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: #F0F4F8;
    }

    /* ── Smooth iOS scrolling everywhere ───────────────────── */
    * { -webkit-overflow-scrolling: touch; }

    /* ── Prevent text rendering issues on iPhone ───────────── */
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    /* ── Input/button resets ───────────────────────────────── */
    input, select, textarea, button {
      font-family: inherit;
      -webkit-appearance: none;
      appearance: none;
    }
    button { cursor: pointer; border: none; background: none; }
    input, textarea { outline: none; }
  </style>

  <!-- OneSignal -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    const ONESIGNAL_APP_ID  = "94b9b25f-e314-4388-a806-6264e8e3dd46";
    const ONESIGNAL_SAFARI  = "web.onesignal.auto.4ddec2dc-5c48-40c7-bde8-da7159bee241";
    // Note: the REST API key is a server-side secret and must never live here.
    // It's only used by netlify/functions/push.js, which now reads it from
    // an environment variable instead of a hardcoded string.

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        safari_web_id: ONESIGNAL_SAFARI,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        notifyButton: { enable: false },
        welcomeNotification: { title: "Shop Manager", message: "Notifications enabled!" },
        promptOptions: {
          slidedown: {
            prompts: [{
              type: "push", autoPrompt: true,
              text: {
                actionMessage: "Get notified when new orders arrive or are ready.",
                acceptButton: "Allow", cancelButton: "Later"
              },
              delay: { pageViews: 1, timeDelay: 5 }
            }]
          }
        }
      });
    });

    // pushNotify calls our Netlify function which proxies to OneSignal server-side
    // This avoids CORS errors that happen when calling OneSignal directly from browser
    window.pushNotify = async function(title, message) {
      try {
        const res = await fetch("https://shivamanage.netlify.app/.netlify/functions/push", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title, message: message })
        });
        const data = await res.json();
        if (data.errors) {
          window._showPushResult("❌ " + JSON.stringify(data.errors));
        } else {
          window._showPushResult("✅ Sent to " + (data.recipients||0) + " devices");
        }
      } catch(e) {
        window._showPushResult("❌ " + e.message);
      }
    };

    // Show result as a toast on screen
    window._showPushResult = function(msg) {
      console.log("Push result:", msg);
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;font-family:Inter,sans-serif;word-break:break-all;white-space:normal;box-shadow:0 4px 20px rgba(0,0,0,.4)";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 6000);
    };

    // TEST BUTTON — tap in app to test notifications
    window._testPush = function() {
      window.pushNotify("🧪 Test Notification", "Push notifications are working!");
    };
  </script>
</head>
<body>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;background:#1A2D5A;color:rgba(255,255,255,.4);font-size:14px;font-family:Inter,sans-serif;">
      Loading…
    </div>
  </div>

  <script>
    window.onerror=function(msg,src,line){
      document.getElementById('root').innerHTML=
        '<div style="background:#F0F4F8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
        '<div style="background:#fff;color:#DC2626;padding:20px;border-radius:10px;max-width:320px;font-family:monospace;font-size:12px">'+
        '<b>Error:</b> '+msg+
        '<br><br><button onclick="location.reload()" style="padding:6px 14px;background:#1D4ED8;color:#fff;border:none;border-radius:6px;cursor:pointer">Retry</button></div></div>';
    };
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script>
    firebase.initializeApp({
      apiKey:"AIzaSyAIu4TVO8uoi8sTTfXeTPB-de535TL1Nog",
      authDomain:"shop-manager-2df23.firebaseapp.com",
      databaseURL:"https://shop-manager-2df23-default-rtdb.firebaseio.com",
      projectId:"shop-manager-2df23",
      storageBucket:"shop-manager-2df23.firebasestorage.app",
      messagingSenderId:"698237275798",
      appId:"1:698237275798:web:698dd5f1cfee55b4cc7cb7"
    });
    const _db=firebase.database();
    window.storage={
      get:async function(key){
        try{var k=key.replace(/[/]/g,'__sl__').replace(/[.]/g,'__dt__');var s=await _db.ref('store/'+k).get();return s.exists()?{key:key,value:s.val()}:null;}
        catch(e){console.error('get',key,e);return null;}
      },
      set:async function(key,value){
        try{var k=key.replace(/[/]/g,'__sl__').replace(/[.]/g,'__dt__');await _db.ref('store/'+k).set(value);return{key:key,value:value};}
        catch(e){console.error('set',key,e);return null;}
      },
      delete:async function(key){
        try{var k=key.replace(/[/]/g,'__sl__').replace(/[.]/g,'__dt__');await _db.ref('store/'+k).remove();return{key:key,deleted:true};}
        catch(e){return null;}
      }
    };
  </script>
  <script>
__APP_JS__
  </script>
</body>
</html>
